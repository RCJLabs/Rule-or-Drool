# Builds the site and publishes dist/ to the gh-pages branch, which GitHub Pages serves at
# https://rcjlabs.github.io/Rule-or-Drool/ (Vite base is set to /Rule-or-Drool/).
# If the site is not live after the first successful run, open Settings > Pages once and
# set Source to "Deploy from a branch", branch gh-pages, folder / (root).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
