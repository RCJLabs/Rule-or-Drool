# Builds the site and deploys it straight to GitHub Pages through the Actions Pages
# pipeline (no gh-pages branch). Serves at https://rcjlabs.github.io/Rule-or-Drool/,
# which is why vite.config.ts sets base to /Rule-or-Drool/.
#
# configure-pages runs with enablement, so the first successful run turns Pages on and
# sets its source to "GitHub Actions" by itself. If that step 403s (org policy, or the
# token cannot create the site), enable it once by hand at Settings > Pages > Source:
# GitHub Actions, then re-run this workflow; nothing else needs changing.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. In-flight runs finish rather than cancel, so a queued deploy
# never lands out of order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
